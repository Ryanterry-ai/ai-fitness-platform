<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitSearch AI — MCP Server</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030712; --bg2: #0f172a; --bg3: #1e293b; --border: rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.15); --accent: #6366f1; --accent2: #8b5cf6;
  --green: #10b981; --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { padding: 20px 24px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 12px; font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: #fff; }
.logo-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.logo-sub { font-size: 11px; font-weight: 500; color: var(--text3); }
.health-badge { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(16, 185, 129, .15); border: 1px solid rgba(16, 185, 129, .3); border-radius: 99px; font-size: 12px; font-weight: 600; color: #34d399; }
.main-container { max-width: 1000px; margin: 0 auto; padding: 24px; }
.search-box { display: flex; gap: 12px; margin-bottom: 16px; }
.search-input { flex: 1; padding: 16px 20px; background: var(--bg2); border: 1.5px solid var(--border2); border-radius: 14px; font-size: 16px; font-weight: 500; color: var(--text); outline: none; }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, .15); }
.search-btn { padding: 16px 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 14px; cursor: pointer; color: #fff; font-size: 15px; font-weight: 600; }
.search-btn:disabled { opacity: .5; cursor: not-allowed; }
.deep-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--text2); }
.deep-toggle.active { background: rgba(139, 92, 246, .15); border-color: rgba(139, 92, 246, .3); color: #a78bfa; }
.intent-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(99, 102, 241, .15); border-radius: 99px; font-size: 12px; font-weight: 600; color: #a5b4fc; }
.results-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
.card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.card-title { font-size: 18px; font-weight: 700; color: #fff; font-family: 'Syne', sans-serif; }
.query-display { font-size: 14px; color: var(--text2); margin-bottom: 16px; padding: 12px 16px; background: var(--bg3); border-radius: 10px; }
.query-display strong { color: var(--accent); }
.web-result { padding: 16px 0; border-bottom: 1px solid var(--border); }
.web-result:last-child { border-bottom: none; }
.result-title { font-size: 15px; font-weight: 600; color: #60a5fa; text-decoration: none; display: block; margin-bottom: 6px; }
.result-title:hover { text-decoration: underline; }
.result-domain { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
.result-snippet { font-size: 14px; color: var(--text2); line-height: 1.6; margin: 8px 0; }
.result-links { display: flex; gap: 10px; margin-top: 12px; }
.link-btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 6px; transition: all .2s; }
.link-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.link-primary:hover { transform: translateY(-1px); }
.link-secondary { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
.loading-dots { display: flex; gap: 6px; justify-content: center; padding: 40px; }
.loading-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: bounce 1.4s infinite ease-in-out; }
.loading-dots span:nth-child(1) { animation-delay: -.32s; }
.loading-dots span:nth-child(2) { animation-delay: -.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 50% { transform: scale(1); } }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 1000; display: none; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div><div>FitSearch MCP</div><div class="logo-sub">Model Context Protocol Server</div></div>
  </div>
  <div class="health-badge" id="healthBadge"><span>●</span><span>Checking...</span></div>
</div>

<div class="main-container">
  <div class="search-box">
    <input type="text" class="search-input" id="searchInput" placeholder="Ask about supplements, workouts, diet..." onkeypress="if(event.key==='Enter')doSearch()">
    <button class="search-btn" id="searchBtn" onclick="doSearch()"><span>🔍</span><span>Search</span></button>
  </div>
  <div style="display:flex;gap:12px;align-items:center;">
    <label class="deep-toggle" id="deepToggle" onclick="toggleDeep()"><span id="deepIcon">○</span><span>Deep Research</span></label>
    <div class="intent-badge" id="intentBadge" style="display:none;"><span id="intentText">supplement</span></div>
  </div>
  <div id="resultsContainer"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let isDeepResearch = false, currentQuery = '';
document.addEventListener('DOMContentLoaded', () => { checkHealth(); document.getElementById('searchInput').focus(); });

async function checkHealth() {
  try {
    const r = await fetch('/health');
    const data = await r.json();
    document.getElementById('healthBadge').innerHTML = data.status === 'ok' 
      ? '<span style="color:#34d399">●</span><span>All Systems OK</span>'
      : '<span style="color:#f87171">●</span><span>Error</span>';
  } catch { document.getElementById('healthBadge').innerHTML = '<span style="color:#f87171">●</span><span>Offline</span>'; }
}

function toggleDeep() {
  isDeepResearch = !isDeepResearch;
  const t = document.getElementById('deepToggle'), i = document.getElementById('deepIcon');
  isDeepResearch ? (t.classList.add('active'), i.textContent = '●') : (t.classList.remove('active'), i.textContent = '○');
}

async function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return;
  currentQuery = query;
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  document.getElementById('resultsContainer').innerHTML = '<div class="results-card"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
  try {
    const r = await fetch(isDeepResearch ? '/mcp/deep_research' : '/mcp/web_search', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query })
    });
    const data = await r.json();
    renderResults(data);
  } catch (e) { showToast('Search failed', 'error'); }
  btn.disabled = false;
}

function renderResults(data) {
  const c = document.getElementById('resultsContainer');
  if (data.error) { c.innerHTML = '<div class="results-card" style="color:#f87171">'+data.error+'</div>'; return; }
  
  const intentBadge = document.getElementById('intentBadge');
  if (data.intent) { intentBadge.style.display = 'inline-flex'; document.getElementById('intentText').textContent = data.intent.primary_intent || 'general'; }
  
  const results = data.results || data.research || {};
  const webResults = results.results || results.articles || [];
  
  let html = `<div class="results-card">
    <div class="card-header">
      <span style="font-size:24px">⚡</span>
      <span class="card-title">${isDeepResearch ? 'Deep Research' : 'Search'} Results</span>
    </div>
    <div class="query-display">Searching for: <strong>"${escHtml(currentQuery)}"</strong></div>`;
  
  if (webResults.length > 0) {
    webResults.forEach(r => {
      const link = r.url || '#';
      html += `<div class="web-result">
        <a href="${escAttr(link)}" target="_blank" class="result-title">${escHtml(r.title || 'No title')}</a>
        <div class="result-domain">${escHtml(r.domain || r.source || '')}</div>
        ${r.snippet ? `<div class="result-snippet">${escHtml(r.snippet)}</div>` : ''}
        <div class="result-links">
          <a href="${escAttr(link)}" target="_blank" class="link-btn link-primary">🔗 Visit Website</a>
          <a href="${escAttr(link)}" target="_blank" class="link-btn link-secondary">📄 Read Article</a>
        </div>
      </div>`;
    });
  } else {
    html += '<p style="color:var(--text2)">No results found.</p>';
  }
  
  c.innerHTML = html + '</div>';
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;'); }
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  t.style.background = type === 'error' ? 'rgba(239,68,68,.95)' : 'rgba(16,185,129,.95)';
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
