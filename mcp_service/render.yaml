services:
  - type: web
    name: fitsearch-mcp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: ZENSERP_API_KEY
        value: 48aaf4f0-2f18-11f1-a074-2981387cadb9
      - key: PORT
        value: "5000"
