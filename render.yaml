services:
  - type: web
    name: fitsearch-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn mcp_server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ZENSERP_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBMED_API_KEY
        sync: false
