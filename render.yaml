# Render Blueprint - FitSearch AI
services:
  - type: web
    name: fitsearch-ai
    runtime: python
    region: oregon
    plan: free
    rootDirectory: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        value: "11962aa111ff110443986c5edfa42c0d"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        value: "AIzaSyAe6LNE1Er_KpTK4PdpTVb5OrqbD5wLZG8"
      - key: GOOGLE_CX
        value: "860eab761ebac4c12"
      - key: OPENAI_API_KEY
        sync: false
