<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FitSearch AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .auth-card { background-color: #1e293b; padding: 36px 28px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  h2 { font-size: 28px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.1); background: #0f172a; color: #e2e8f0; outline: none; transition: all 0.2s; }
  input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
  button { width: 100%; padding: 12px; font-weight: 600; background: #3b82f6; color: #fff; border-radius: 10px; cursor: pointer; transition: all 0.2s; border: none; }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
<div class="auth-card">
  <h2>Sign In</h2>
  <input id="email" type="email" placeholder="Enter your email">
  <input id="password" type="password" placeholder="Enter your password">
  <button onclick="login()">Login</button>
</div>
<script src="/static/app.js"></script>
</body>
</html>
