<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Research Platform</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:system-ui;
}

.card{
background:#1e293b;
padding:16px;
border-radius:12px;
border:1px solid #334155;
margin-bottom:12px;
}

.badge{
padding:4px 8px;
border-radius:6px;
font-size:11px;
background:#1e40af;
}

.save-btn{
background:#10b981;
padding:4px 10px;
border-radius:6px;
font-size:11px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="max-w-5xl mx-auto mt-10">

<h1 class="text-3xl font-bold mb-6">
AI Research Platform
</h1>

<!-- Auth Section -->

<div id="auth-section" class="mb-6">

<button onclick="googleLogin()" 
class="bg-white text-black px-4 py-2 rounded-lg mr-2">
Login with Google
</button>

<button onclick="phoneLogin()" 
class="bg-green-600 px-4 py-2 rounded-lg">
Login with Phone
</button>

<div id="user-info" class="mt-3"></div>

</div>

<!-- Search -->

<div class="card">

<input 
id="searchInput"
class="w-full p-3 rounded-lg text-black"
placeholder="Search anything with research evidence..."
/>

<button
onclick="performSearch()"
class="mt-3 bg-blue-600 px-4 py-2 rounded-lg"
>
Search
</button>

</div>

<!-- Dashboard -->

<div id="dashboard" class="mt-6"></div>

<!-- Recommendations -->

<div id="recommendations" class="mt-6"></div>

<!-- Saved Searches -->

<div id="saved-searches" class="mt-6"></div>

<!-- Saved Results -->

<div id="saved-results" class="mt-6"></div>

<!-- Results -->

<div id="search-results" class="mt-6"></div>

</div>


<script>

let userHistory = [];
let savedSearches = [];
let savedResults = [];


// Saved Searches

function saveSearch(query){
savedSearches.push(query);
localStorage.setItem("savedSearches", JSON.stringify(savedSearches));
renderSavedSearches();
}


function renderSavedSearches(){

document.getElementById("saved-searches").innerHTML = `

<div class="card">

<h2 class="text-lg font-bold mb-2">Saved Searches</h2>

${savedSearches.map(s => `

<div 
style="cursor:pointer;color:#3b82f6"
onclick="searchFromSaved('${s}')"
>

${s}

</div>

`).join("")}

</div>

`;

}

function searchFromSaved(q){
document.getElementById("searchInput").value = q;
performSearch();
}


// Saved Results

function saveResult(result){

savedResults.push(result);

localStorage.setItem("savedResults", JSON.stringify(savedResults));

renderSavedResults();

}


function renderSavedResults(){

document.getElementById("saved-results").innerHTML = `

<div class="card">

<h2 class="text-lg font-bold mb-2">
Saved Results
</h2>

${savedResults.map(r => `

<div style="margin-bottom:10px">

<div style="font-weight:600">
${r.title}
</div>

<div style="font-size:12px;color:#94a3b8">
${r.summary}
</div>

</div>

`).join("")}

</div>

`;

}


// Recommendation Engine

function generateRecommendations(){

const keywords = userHistory.slice(-5);

document.getElementById("recommendations").innerHTML = `

<div class="card">

<h2 class="text-lg font-bold mb-2">
Recommended Searches
</h2>

${keywords.map(k => `

<div 
style="cursor:pointer;color:#10b981"
onclick="searchFromSaved('${k}')"
>

${k}

</div>

`).join("")}

</div>

`;

}


// Dashboard

function renderDashboard(){

document.getElementById("dashboard").innerHTML = `

<div class="card">

<h2 class="text-lg font-bold mb-2">
User Dashboard
</h2>

Recent Searches

${userHistory.slice(-5).map(h => `
<div>${h}</div>
`).join("")}

</div>

`;

}


// Search

async function performSearch(){

const query = document.getElementById("searchInput").value;

if(!query) return;

userHistory.push(query);

saveSearch(query);

renderDashboard();

generateRecommendations();

document.getElementById("search-results").innerHTML =
"Searching verified research...";

try{

const response = await fetch("/search",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
query,
history:userHistory
})

});

const data = await response.json();

renderSearchResults(data.results);

}catch(e){

document.getElementById("search-results").innerHTML =
"Search Failed";

}

}


// Render Results

function renderSearchResults(results){

document.getElementById("search-results").innerHTML =

results.map(r => `

<div class="card">

<div style="display:flex;justify-content:space-between">

<div style="font-weight:700">
${r.title}
</div>

<div class="save-btn"
onclick='saveResult(${JSON.stringify(r)})'>
Save
</div>

</div>

<p>${r.summary}</p>

${r.evidence ? `
<div style="font-size:12px">
Evidence: ${r.evidence}
</div>
` : ""}

</div>

`).join("");

}


// Load Saved Data

function loadSaved(){

savedSearches = JSON.parse(localStorage.getItem("savedSearches")||"[]");

savedResults = JSON.parse(localStorage.getItem("savedResults")||"[]");

renderSavedSearches();

renderSavedResults();

}

loadSaved();

</script>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
RecaptchaVerifier,
signInWithPhoneNumber,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyAe6LNE1Er_KpTK4PdpTVb5OrqbD5wLZG8",
authDomain: "ai-fitness-platform-94093.firebaseapp.com",
projectId: "ai-fitness-platform-94093",
storageBucket: "ai-fitness-platform-94093.firebasestorage.app",
messagingSenderId: "450345763708",
appId: "1:450345763708:web:e8967ea4b572a1f9da9af9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


window.googleLogin = async function(){

const provider = new GoogleAuthProvider();

const result = await signInWithPopup(auth, provider);

showUser(result.user);

}


window.phoneLogin = function(){

const phone = prompt("Enter phone");

window.recaptcha = new RecaptchaVerifier(
auth,
'auth-section',
{size:'invisible'}
);

signInWithPhoneNumber(auth, phone, window.recaptcha)
.then(c => {

const code = prompt("OTP");

return c.confirm(code);

})
.then(result => showUser(result.user));

}


function showUser(user){

document.getElementById("user-info").innerHTML = `

<div class="card">

<div>${user.displayName || user.phoneNumber}</div>

<button onclick="logout()"
class="bg-red-500 px-3 py-1 mt-2 rounded">
Logout
</button>

</div>

`;

}


window.logout = function(){

signOut(auth);

document.getElementById("user-info").innerHTML="";

}

onAuthStateChanged(auth, user=>{

if(user) showUser(user);

});

</script>


</body>
</html>
