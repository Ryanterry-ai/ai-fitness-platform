<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Fitness Search</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#0b0f17;
color:white;
font-family:Inter,system-ui,-apple-system;
margin:0;
padding:0;
}

.main{
max-width:900px;
margin:120px auto 40px;
padding:0 20px;
}

.search-wrapper{
display:flex;
gap:10px;
background:#0f172a;
padding:10px;
border-radius:14px;
border:1px solid #1e293b;
}

.search-input{
flex:1;
background:transparent;
border:none;
outline:none;
color:white;
font-size:16px;
padding:12px;
}

.search-btn{
background:#3b82f6;
border:none;
padding:12px 26px;
border-radius:10px;
color:white;
font-weight:600;
cursor:pointer;
}

.search-btn:hover{
background:#2563eb;
}

.results{
max-width:900px;
margin:30px auto;
padding:0 20px;
}

.loader{
text-align:center;
margin-top:40px;
color:#94a3b8;
}

.answer-card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

.sources-card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:12px;
padding:16px;
margin-bottom:12px;
}

.source-title{
color:#60a5fa;
font-weight:600;
}

.source-meta{
font-size:13px;
color:#94a3b8;
margin-top:4px;
}

</style>

</head>

<body>

<div class="main">

<div class="search-wrapper">

<input
id="searchInput"
class="search-input"
placeholder="Search fitness, supplements, SARMs, peptides, diet plans..."
onkeydown="if(event.key==='Enter') search()"
/>

<button
class="search-btn"
onclick="search()"
>
Search
</button>

</div>

</div>

<div id="results" class="results"></div>


<script>

async function search(){

let query = document.getElementById("searchInput").value;

if(!query) return;

document.getElementById("results").innerHTML = `
<div class="loader">
Searching AI fitness knowledge...
</div>
`;

try{

let response = await fetch("/search",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
query:query
})
});

let data = await response.json();

renderResults(data);

}catch(e){

document.getElementById("results").innerHTML = `
<div class="loader">
Error loading results
</div>
`;

}

}



function renderResults(data){

if(!data){

document.getElementById("results").innerHTML="No Results Found";

return;

}

let html = "";


if(data.answer){

html += `

<div class="answer-card">

<h2 style="font-size:22px;font-weight:700;margin-bottom:12px;">
AI Answer
</h2>

<div style="line-height:1.7">
${data.answer}
</div>

</div>

`;

}


if(data.sources && data.sources.length){

html += `
<h3 style="margin-bottom:10px;font-size:18px;font-weight:600">
Sources
</h3>
`;

data.sources.forEach(source=>{

html += `

<div class="sources-card">

<a 
href="${source.link}" 
target="_blank"
class="source-title"
>
${source.title}
</a>

<div class="source-meta">
${source.source || ""}
</div>

</div>

`;

});

}

document.getElementById("results").innerHTML = html;

}

</script>

</body>

</html>
