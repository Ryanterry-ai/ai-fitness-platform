<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Research Platform</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:system-ui;
}

.search-box{
background:#1e293b;
padding:20px;
border-radius:12px;
}

.card{
background:#1e293b;
padding:16px;
border-radius:12px;
border:1px solid #334155;
}

.badge{
padding:4px 8px;
border-radius:6px;
font-size:11px;
}

.badge-blue{
background:#1e40af;
}

</style>

</head>

<body>

<div class="max-w-5xl mx-auto mt-12">

<h1 class="text-3xl font-bold mb-6">
AI Research Search Platform
</h1>

<!-- Search Box -->

<div class="search-box">

<input 
id="searchInput"
class="w-full p-3 rounded-lg text-black"
placeholder="Search anything with research evidence..."
/>

<button
onclick="performSearch()"
class="mt-3 bg-blue-600 px-4 py-2 rounded-lg"
>
Search
</button>

</div>

<!-- Results -->

<div id="search-results" class="mt-6"></div>

</div>

<script>

const API = "";

async function performSearch() {

const query = document.getElementById("searchInput").value;

if (!query) return;

document.getElementById("search-results").innerHTML =
"<div>Searching verified research...</div>";

try {

const response = await fetch(API + "/search", {

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
query: query
})

});

const contentType = response.headers.get("content-type");

let data;

if (contentType && contentType.includes("application/json")) {
data = await response.json();
} else {
throw new Error("Server returned HTML instead of JSON");
}

renderSearchResults(data.results, query);

} catch (error) {

document.getElementById("search-results").innerHTML =

`<div style="color:red;">
Search failed. Please try again.
</div>`;

}

}



function renderSearchResults(results, query) {

if (!results || !results.length) {

document.getElementById('search-results').innerHTML =

`<div style="text-align:center;padding:40px 0;color:#94a3b8;">
No verified results found for "${query}"
</div>`;

return;
}

document.getElementById('search-results').innerHTML =

`<div style="font-size:13px;color:#94a3b8;margin-bottom:12px;">
${results.length} verified results for "${query}"
</div>

${results.map(r => `

<div class="card" style="margin-bottom:14px;">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">

<div style="font-size:16px;font-weight:700;">
${r.title || "Research Result"}
</div>

<span class="badge badge-blue">
${r.category || 'Research'}
</span>

</div>

<p style="font-size:13px;color:#cbd5e1;line-height:1.6;">
${r.summary || "Research based information"}
</p>

${r.evidence ? `

<div style="margin-top:10px;padding:8px;background:#020617;border-radius:6px;font-size:12px;">
<b>Evidence:</b> ${r.evidence}
</div>

` : ''}

${r.sources ? `

<div style="margin-top:8px;font-size:12px;">

<b>Sources:</b>

${r.sources.map(s => `
<a href="${s.url}" target="_blank"
style="display:block;color:#3b82f6;">
${s.title}
</a>
`).join('')}

</div>

` : ''}

${r.confidence ? `

<div style="margin-top:8px;font-size:11px;color:#94a3b8;">
Confidence: ${r.confidence}
</div>

` : ''}

</div>

`).join('')}
`;

}

</script>

</body>
</html>
