<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitSearch AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Space Grotesk', sans-serif; background: #050810; color: #e2e8f0; }
  .chat-container { max-width: 800px; margin: 0 auto; padding: 20px; }
  .result-card {
    background: #0a0f1e;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .result-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .result-content { line-height: 1.7; }
  .markdown p { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="chat-container">
  <div id="results"></div>
</div>

<script>
  // Your existing search logic here
  // When results arrive, render them in ChatGPT-like format
  function renderResults(results) {
    const container = document.getElementById('results');
    container.innerHTML = '';

    results.forEach(result => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="result-title">${result.name}</div>
        <div class="text-sm text-gray-400 mb-4">${result.tagline}</div>
        <div class="result-content markdown">
          <p><strong>What it is:</strong> ${result.what_it_is}</p>
          <p><strong>How it works:</strong> ${result.how_it_works}</p>
          <p><strong>Final Recommendation:</strong> ${result.final_recommendation}</p>
        </div>
      `;
      container.appendChild(card);
    });
  }
</script>
</body>
</html>
