<!DOCTYPE html>
<html>

<head>

<title>AI Fitness Search</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-900 text-white">

<div class="max-w-5xl mx-auto p-6">

<h1 class="text-4xl font-bold mb-6">
AI Fitness Answer Engine
</h1>


<input id="searchInput"
class="w-full p-4 text-black rounded"
/>


<div class="flex gap-2 mt-4">

<button onclick="search()"
class="bg-blue-600 px-4 py-2 rounded">
Search
</button>

<button onclick="deep()"
class="bg-purple-600 px-4 py-2 rounded">
Deep Research
</button>

</div>


<h3 class="mt-6">Trending</h3>

<div id="trending" class="flex gap-2 flex-wrap"></div>

<div id="results" class="mt-6"></div>

</div>


<script>

async function search(){

const q=document.getElementById("searchInput").value

const r=await fetch("/search",{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({query:q})

})

const d=await r.json()

render(d.data)

}


async function deep(){

const q=document.getElementById("searchInput").value

const r=await fetch("/deep-search",{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({query:q})

})

const d=await r.json()

render(d.data)

}


function render(d){

let html=""

html+=`<h2>${d.query}</h2>`

html+=`<div class="bg-gray-800 p-4 mt-2">
${d.ai_answer}
</div>`


d.results.forEach(r=>{

html+=`

<div class="mt-2 bg-gray-800 p-2">

${r.data.title}

<span class="ml-2 text-xs bg-green-600 px-2 rounded">

${r.credibility}

</span>

</div>

`

})

document.getElementById("results").innerHTML=html

}


async function loadTrending(){

const r=await fetch("/trending")

const d=await r.json()

let html=""

d.trending.forEach(t=>{

html+=`

<button
onclick="quick('${t}')"
class="bg-gray-700 px-3 py-1 rounded">

${t}

</button>

`

})

document.getElementById("trending").innerHTML=html

}

function quick(q){

document.getElementById("searchInput").value=q

search()

}

loadTrending()

</script>

</body>

</html>
