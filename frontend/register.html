<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — FitSearch AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .auth-card { background-color: #1e293b; padding: 36px 28px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  h2 { font-size: 28px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  input, select { width: 100%; padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); background: #0f172a; color: #e2e8f0; outline: none; transition: all 0.2s; }
  input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
  button { width: 100%; padding: 12px; font-weight: 600; background: #3b82f6; color: #fff; border-radius: 10px; cursor: pointer; transition: all 0.2s; border: none; }
  button:hover { background: #2563eb; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<div class="auth-card">
  <h2>Create Account</h2>
  <div class="grid-2">
    <input id="name" placeholder="Full Name">
    <input id="email" type="email" placeholder="Email">
  </div>
  <input id="password" type="password" placeholder="Password (min 6 chars)">
  <div class="grid-2">
    <select id="goal">
      <option value="muscle_gain">Muscle gain</option>
      <option value="fat_loss">Fat loss</option>
      <option value="recomp">Recomposition</option>
      <option value="strength">Strength</option>
    </select>
    <select id="experience">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
  </div>
  <div class="grid-3">
    <input id="weight" type="number" placeholder="Weight (kg)">
    <input id="height" type="number" placeholder="Height (cm)">
    <input id="age" type="number" placeholder="Age">
  </div>
  <button onclick="register()">Register</button>
</div>
<script src="/static/app.js"></script>
</body>
</html>
